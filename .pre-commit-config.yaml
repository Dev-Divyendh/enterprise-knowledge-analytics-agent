repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]

      - id: pyright
        name: Pyright strict type check
        entry: uv run --frozen pyright
        language: system
        pass_filenames: false
        always_run: true

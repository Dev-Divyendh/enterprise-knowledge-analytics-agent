[project]
name = "enterprise-knowledge-analytics-agent"
version = "0.1.0"
description = "A secure enterprise assistant for grounded document question answering and read-only analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "docling>=2.121.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
enterprise-knowledge-analytics-agent = "enterprise_knowledge_analytics_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: requires the local PostgreSQL service",
]

[tool.coverage.run]
branch = true
source = ["enterprise_knowledge_analytics_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
